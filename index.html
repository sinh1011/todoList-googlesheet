<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>React Core – Daily Checklist (Google Sheet)</title>
    <style>
        :root{ --bg1:#070A14; --bg2:#0A1024; --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.04); --line: rgba(255,255,255,.10); --text:#EAF0FF; --muted: rgba(234,240,255,.70); --accent:#7C5CFF; --accent2:#4ACBFF; --good:#2EE59D; --warn:#FFB020; --bad:#FF4D6D; --shadow: 0 18px 50px rgba(0,0,0,.45); --radius: 22px; }
        *{ box-sizing:border-box; }
        html, body{ height:100%; }
        body{ margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; color: var(--text); background: radial-gradient(900px 500px at 18% 10%, rgba(124,92,255,.35), transparent 60%), radial-gradient(900px 500px at 80% 18%, rgba(74,203,255,.22), transparent 60%), radial-gradient(800px 500px at 45% 80%, rgba(46,229,157,.12), transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg2)); overflow-x:hidden; }
        .wrap{ max-width: 1080px; margin: 0 auto; padding: 26px 16px 40px; }
        .topbar{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap; margin-bottom: 18px; }
        .brand{ display:flex; gap:14px; align-items:center; }
        .logo{ width: 44px; height: 44px; border-radius: 14px; background: radial-gradient(12px 12px at 30% 30%, rgba(255,255,255,.85), transparent 70%), linear-gradient(135deg, rgba(124,92,255,1), rgba(74,203,255,1)); box-shadow: 0 14px 35px rgba(124,92,255,.25); border: 1px solid rgba(255,255,255,.14); }
        h1{ margin:0; font-size: 20px; letter-spacing: .2px; line-height: 1.1; }
        .subtitle{ margin:6px 0 0; font-size: 13px; color: var(--muted); }
        .quickActions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .chip{ display:flex; align-items:center; gap:8px; padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,.25); user-select:none; }
        .dot{ width:10px; height:10px; border-radius: 99px; background: linear-gradient(135deg, var(--good), var(--accent2)); box-shadow: 0 0 0 4px rgba(46,229,157,.10); }
        button{ cursor:pointer; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); padding: 10px 12px; border-radius: 14px; font-weight: 700; transition: transform .08s ease, border-color .15s ease, background .15s ease; }
        button:hover{ border-color: rgba(124,92,255,.45); background: rgba(124,92,255,.10); }
        button:active{ transform: translateY(1px); }
        .danger{ border-color: rgba(255,77,109,.35); }
        .danger:hover{ border-color: rgba(255,77,109,.65); background: rgba(255,77,109,.12); }
        .summaryGrid{ display:grid; grid-template-columns: 1.2fr .8fr; gap: 14px; margin-bottom: 14px; }
        @media (max-width: 860px){ .summaryGrid{ grid-template-columns: 1fr; } }
        .panel{ border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px; position: relative; overflow:hidden; }
        .panelTitle{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; position: relative; z-index: 1; }
        .panelTitle h2{ margin:0; font-size: 14px; color: rgba(234,240,255,.85); letter-spacing:.2px; }
        .bigNumber{ font-size: 26px; font-weight: 900; letter-spacing: .2px; }
        .muted{ color: var(--muted); font-size: 12px; }
        .progressBar{ height: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.22); overflow:hidden; position: relative; z-index: 1; }
        .progressFill{ height:100%; width:0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 18px rgba(124,92,255,.35); transition: width .2s ease; }
        .summaryRow{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin: 10px 0 10px; position: relative; z-index: 1; }
        .controls{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; padding: 14px; border:1px solid var(--line); border-radius: var(--radius); background: var(--card2); box-shadow: 0 18px 45px rgba(0,0,0,.32); backdrop-filter: blur(10px); margin-bottom: 14px; }
        .field{ display:flex; flex-direction:column; gap:6px; min-width: 230px; flex: 0 0 auto; }
        .field.grow{ flex: 1 1 auto; min-width: 240px; }
        label{ font-size: 12px; color: rgba(234,240,255,.70); }
        select, input{ height: 42px; border-radius: 14px; border:1px solid rgba(255,255,255,.12); background: rgba(10,16,36,.55); color: var(--text); padding: 0 12px; outline:none; }
        input::placeholder{ color: rgba(234,240,255,.45); }
        .content{ display:flex; flex-direction:column; gap: 14px; }
        .cardBlock{ border-radius: var(--radius); background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.10); box-shadow: var(--shadow); overflow:hidden; }
        .cardHead{ padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; gap:12px; align-items:flex-start; background: radial-gradient(700px 220px at 12% 0%, rgba(74,203,255,.12), transparent 60%), rgba(255,255,255,.02); }
        .cardHead h3{ margin:0; font-size: 15px; letter-spacing:.2px; }
        .cardHead .small{ margin-top:6px; color: rgba(234,240,255,.65); font-size: 12px; }
        .cardBody{ padding: 12px 14px 14px; }
        .section{ padding: 12px 0; border-top: 1px dashed rgba(255,255,255,.12); }
        .sectionTitleRow{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom: 10px; }
        .sectionTitle{ display:flex; align-items:center; gap:10px; font-weight: 800; letter-spacing:.15px; }
        .badge{ font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: rgba(234,240,255,.85); white-space: nowrap; }
        ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
        .task{ border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.18); border-radius: 16px; padding: 10px 12px; transition: transform .08s ease, border-color .15s ease, background .15s ease; }
        .task:hover{ border-color: rgba(124,92,255,.35); background: rgba(124,92,255,.07); }
        .taskRow{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; }
        .taskRow input{ width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor:pointer; }
        .taskText{ line-height: 1.25; font-size: 14px; }
        .taskText.done{ text-decoration: line-through; opacity: .70; }
        footer{ margin-top: 18px; color: rgba(234,240,255,.55); font-size: 12px; text-align:center; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7, 10, 20, 0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">Đang tải dữ liệu...</div>
    <div class="wrap">
        <header class="topbar">
            <div class="brand"><div class="logo"></div><div><h1>React Core – Daily Checklist</h1><p class="subtitle">Lưu trữ Google Sheet ☁️</p></div></div>
            <div class="quickActions">
                <div class="chip"><div class="dot"></div><span id="progressText">0/0 • 0%</span></div>
                <button id="markVisibleBtn">✅ Tick phần đang xem</button>
                <button id="resetBtn" class="danger">↺ Reset</button>
            </div>
        </header>

        <div class="summaryGrid">
            <div class="panel">
                <div class="panelTitle"><h2>Progress tổng</h2><span class="badge" id="percentText">0%</span></div>
                <div class="bigNumber">Cứ mỗi ngày tick chút là auto lên trình 🚀</div>
                <div class="progressBar"><div id="barFill" class="progressFill"></div></div>
            </div>
            <div class="panel">
                <div class="panelTitle"><h2>Tip nhỏ</h2></div>
                <div class="summaryRow"><span class="muted" id="doneText">Done: 0</span><span class="muted" id="totalText">Total: 0</span></div>
                <div class="muted">Học mỗi ngày 30–45 phút là đủ 😌</div>
            </div>
        </div>

        <div class="controls">
            <div class="field"><label>Chọn ngày</label><select id="daySelect"></select></div>
            <div class="field grow"><label>Tìm nhanh</label><input id="searchInput" placeholder="Ví dụ: useState, props, map..."></div>
        </div>
        <div id="app" class="content"></div>
        <footer><div class="hint">Muốn sửa checklist: chỉnh <strong>DATA</strong> ở trong file này ✨</div></footer>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbz75TIrlpWV95Sf0IFt2A1U0Y5gAH39JGIFhjK_WHSK6xJfht12QYCj-sr_-A3rc6xe/exec';
        const DATA = [
            { id: "stage0", title: "Giai đoạn 0 – Ôn JS (Hoàn thành)", desc: "Bạn đã làm xong phần JS core rồi 🔥", items: [
                { id: "s0_letconst", text: "let / const", doneByDefault: true },
                { id: "s0_arrow", text: "Arrow function", doneByDefault: true },
                { id: "s0_destructuring", text: "Destructuring", doneByDefault: true },
                { id: "s0_spread", text: "Spread operator", doneByDefault: true },
                { id: "s0_mapfilterreduce", text: "map / filter / reduce", doneByDefault: true },
            ]},
            { id: "stage1", title: "Giai đoạn 1 – React Core (2–3 tuần)", desc: "Đi đều từng ngày là lên tay nhanh lắm 😤", sections: [
                { id: "day1", title: "Day 1 – Setup & JSX", items: [
                    { id: "d1_vite", text: "Tạo project bằng Vite" }, { id: "d1_jsx", text: "Hiểu JSX là gì" }, { id: "d1_app", text: "Tạo component App" }, { id: "d1_component", text: "1️⃣ Component là gì" }, { id: "d1_jsx2", text: "2️⃣ JSX là gì" }, { id: "d1_props", text: "3️⃣ Props" }, { id: "d1_state", text: "4️⃣ State (useState)" }, { id: "d1_list", text: "5️⃣ Render list (map)" },
                ]},
                { id: "day2", title: "Day 2 – Component & Props", items: [{ id: "d2_split", text: "Tách component" }, { id: "d2_props", text: "Truyền props" }, { id: "d2_destructure", text: "Destructuring props" }]},
                { id: "day3", title: "Day 3 – useState", items: [{ id: "d3_concept", text: "Khái niệm state" }, { id: "d3_setstate", text: "setState đúng cách" }, { id: "d3_counter", text: "Counter app" }]},
                { id: "day4", title: "Day 4 – Event & Conditional Rendering", items: [{ id: "d4_events", text: "onClick / onChange" }, { id: "d4_conditional", text: "Điều kiện &&, ? :" }, { id: "d4_toggle", text: "Toggle show/hide" }]},
                { id: "day5", title: "Day 5 – Render List", items: [{ id: "d5_map", text: "map render list" }, { id: "d5_key", text: "key là gì" }, { id: "d5_todo_show", text: "Todo list hiển thị" }]},
                { id: "day6", title: "Day 6 – Form & Input", items: [{ id: "d6_controlled", text: "Controlled component" }, { id: "d6_form_add", text: "Form add todo" }]},
                { id: "day7", title: "Day 7 – Lifting State", items: [{ id: "d7_lift", text: "Đưa state lên component cha" }, { id: "d7_callback", text: "Truyền callback" }]},
                { id: "day8", title: "Day 8 – useEffect cơ bản", items: [{ id: "d8_once", text: "useEffect chạy 1 lần" }, { id: "d8_deps", text: "Dependency array" }]},
                { id: "day9", title: "Day 9 – useEffect + API", items: [{ id: "d9_fetch", text: "Fetch API" }, { id: "d9_loading", text: "Loading / error" }]},
                { id: "day10", title: "Day 10 – Mini Project", items: [{ id: "d10_todo_full", text: "Todo app hoàn chỉnh" }, { id: "d10_localstorage", text: "LocalStorage" }]},
            ]}
        ];

        const appEl = document.getElementById("app"), daySelect = document.getElementById("daySelect"), searchInput = document.getElementById("searchInput"), resetBtn = document.getElementById("resetBtn"), markVisibleBtn = document.getElementById("markVisibleBtn"), progressText = document.getElementById("progressText"), percentText = document.getElementById("percentText"), doneText = document.getElementById("doneText"), totalText = document.getElementById("totalText"), barFill = document.getElementById("barFill"), loadingEl = document.getElementById("loading");
        let checked = {}, selectedDay = "all", query = "", saveTimeout = null;

        function buildDefaultState(){
            const state = {};
            for(const b of DATA){
                if(b.items) for(const it of b.items) state[it.id] = !!it.doneByDefault;
                if(b.sections) for(const s of b.sections) for(const it of s.items) state[it.id] = !!it.doneByDefault;
            }
            return state;
        }

async function apiCall(payload){
          try{ const url = API_URL + '?action=' + payload.action + (payload.data !== undefined ? '&data=' + encodeURIComponent(JSON.stringify(payload.data)) : ''); const r = await fetch(url); return await r.json(); } catch(e){ return {ok:false}; }
        }

        function debouncedSave(){
            if(saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const res = await apiCall({ action: 'saveAll', data: checked });
                if(!res.ok) alert("Lỗi lưu dữ liệu!");
            }, 1000);
        }

        async function init(){
            loadingEl.style.display = 'flex';
            try{
                const r = await fetch(API_URL + '?action=getAll');
                const res = await r.json();
                checked = res.ok ? (res.data || buildDefaultState()) : buildDefaultState();
            } catch(e){ checked = buildDefaultState(); }
            loadingEl.style.display = 'none';
            buildDayOptions(); render();
        }

        function buildDayOptions(){
            const sections = DATA.find(x => x.id === "stage1")?.sections || [];
            daySelect.innerHTML = "";
            [{id:"all", title:"Tất cả"}, ...sections].forEach(o => {
                const op = document.createElement("option"); op.value = o.id; op.textContent = o.title; daySelect.appendChild(op);
            });
        }

        function render(){
            const q = query.trim().toLowerCase(), wantDay = selectedDay !== "all" ? selectedDay : null;
            appEl.innerHTML = "";
            DATA.forEach(block => {
                const items = (block.items || []).filter(it => !q || it.text.toLowerCase().includes(q));
                const sections = (block.sections || []).filter(s => !wantDay || s.id === wantDay).map(s => ({ ...s, items: s.items.filter(it => !q || it.text.toLowerCase().includes(q)) })).filter(s => s.items.length > 0);
                if(!items.length && !sections.length) return;

                const card = document.createElement("section"); card.className = "cardBlock";
                card.innerHTML = `<div class="cardHead"><div><h3>${block.title}</h3><div class="small">${block.desc||""}</div></div></div>`;
                const body = document.createElement("div"); body.className = "cardBody";
                if(items.length) body.appendChild(renderList(items));
                sections.forEach(s => {
                    const sDiv = document.createElement("div"); sDiv.className = "section";
                    const doneCount = s.items.filter(it => checked[it.id]).length;
                    sDiv.innerHTML = `<div class="sectionTitleRow"><div class="sectionTitle">${s.title}</div><div class="badge">${doneCount}/${s.items.length}</div></div>`;
                    sDiv.appendChild(renderList(s.items)); body.appendChild(sDiv);
                });
                card.appendChild(body); appEl.appendChild(card);
            });
            updateUI();
        }

        function renderList(items){
            const ul = document.createElement("ul");
            items.forEach(it => {
                const li = document.createElement("li"); li.className = "task";
                li.innerHTML = `<label class="taskRow"><input type="checkbox" ${checked[it.id]?'checked':''}><div class="taskText ${checked[it.id]?'done':''}">${it.text}</div></label>`;
                li.querySelector('input').onchange = (e) => {
                    checked[it.id] = e.target.checked; render(); debouncedSave();
                };
                ul.appendChild(li);
            });
            return ul;
        }

        function updateUI(){
            let done = 0, total = 0;
            for(const b of DATA){
                if(b.items){ total += b.items.length; b.items.forEach(it => { if(checked[it.id]) done++; }); }
                if(b.sections){ b.sections.forEach(s => { total += s.items.length; s.items.forEach(it => { if(checked[it.id]) done++; }); }); }
            }
            const pct = total ? Math.round(done/total*100) : 0;
            progressText.textContent = `${done}/${total} • ${pct}%`; percentText.textContent = `${pct}%`;
            doneText.textContent = `Done: ${done}`; totalText.textContent = `Total: ${total}`;
            barFill.style.width = `${pct}%`;
        }

        daySelect.onchange = (e) => { selectedDay = e.target.value; render(); };
        searchInput.oninput = (e) => { query = e.target.value; render(); };
        resetBtn.onclick = async () => { if(confirm("Reset?")){ checked = buildDefaultState(); render(); await apiCall({ action: 'saveAll', data: checked }); }};
        markVisibleBtn.onclick = () => {
            const q = query.trim().toLowerCase(), wantDay = selectedDay !== "all" ? selectedDay : null;
            DATA.forEach(b => {
                (b.items || []).filter(it => !q || it.text.toLowerCase().includes(q)).forEach(it => checked[it.id] = true);
                (b.sections || []).filter(s => !wantDay || s.id === wantDay).forEach(s => s.items.filter(it => !q || it.text.toLowerCase().includes(q)).forEach(it => checked[it.id] = true));
            });
            render(); debouncedSave();
        };

        init();
    </script>
</body>
</html>
